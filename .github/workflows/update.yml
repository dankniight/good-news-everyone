name: Update stories

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stories
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests

      - run: python src/news_aggregator.py

      - name: Commit if news.json changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name  "green-shoots-bot"
            git config user.email "green-shoots-bot@users.noreply.github.com"
            git add news.json
            git commit -m "Update stories"
            git push
          else
            echo "No changes."
          fi
