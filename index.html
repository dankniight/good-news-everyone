<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F6F0">
<title>Good News, Everyone: positive climate and community stories</title>
<meta name="description" content="Positive climate, nature and community stories, gathered from independent publications and updated through the day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E6B3C'/%3E%3Cpath d='M16 26V15' stroke='%23F2F6F0' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M16 17c0-5-3.5-8-8.5-8 0 5 3.500 8 8.500 8z' fill='%23F5C133'/%3E%3Cpath d='M16 14c0-4 3-7 8.500-7 0 4-3 7-8.500 7z' fill='%23F2F6F0'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">

<script>
// Set the theme before first paint so there's no flash of the wrong one.
(function () {
  try {
    var t = localStorage.getItem('gs-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.classList.toggle('dark', t === 'dark');
  } catch (e) {}
})();
</script>

<style>
:root {
  --paper: #F2F6F0;
  --surface: #FFFFFF;
  --ink: #10241A;
  --dim: #3F544A;
  --faint: #5A6E62;
  --rule: #D3DFD4;
  --moss: #2E6B3C;
  --on-moss: #F2F6F0;
  --sun: #F5C133;
  --focus: #2F6FB0;
  --display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --text: 'Newsreader', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
html.dark {
  --paper: #0D1812;
  --surface: #14231B;
  --ink: #E8F1E9;
  --dim: #B2C4B8;
  --faint: #8CA195;
  --rule: #233829;
  --moss: #8ED39B;
  --on-moss: #0D1812;
  --focus: #7DB4EA;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.0625rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.5rem); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Theme button ---------- */
.theme-btn {
  position: fixed; top: 1rem; right: 1rem; z-index: 10;
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--rule); cursor: pointer;
}
.theme-btn:hover { border-color: var(--ink); }
.theme-btn svg { width: 19px; height: 19px; }
.theme-btn .i-sun { display: none; }
html.dark .theme-btn .i-sun { display: block; }
html.dark .theme-btn .i-moon { display: none; }

/* ---------- Masthead ---------- */
.masthead { padding-top: clamp(4rem, 9vw, 5.5rem); }
.masthead-top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem;
  border-bottom: 2px solid var(--ink);
}
.title {
  margin: 0; padding-bottom: .06em;
  font-family: var(--display); font-weight: 800;
  font-size: clamp(3rem, 9.5vw, 7rem);
  line-height: .92; letter-spacing: -.035em;
}
.horizon {
  flex: none; overflow: hidden;
  width: clamp(84px, 15vw, 168px); height: clamp(42px, 7.5vw, 84px);
}
.sun {
  width: 100%; aspect-ratio: 1; border-radius: 50%;
  background: var(--sun);
  animation: rise 2.2s cubic-bezier(.2, .7, .15, 1) both;
}
@keyframes rise { from { transform: translateY(58%); } to { transform: translateY(0); } }

.tagline { margin: 1rem 0 0; font-size: 1.15rem; color: var(--dim); max-width: 60ch; }

.topics { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
.chip {
  font: 500 .95rem/1 var(--display);
  padding: .6rem 1rem; border-radius: 999px;
  border: 1.5px solid var(--rule); background: transparent; color: var(--dim);
  cursor: pointer; display: inline-flex; align-items: center; gap: .45rem;
  transition: border-color .15s ease, color .15s ease, background-color .15s ease;
}
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--moss); border-color: var(--moss); color: var(--on-moss); }
.chip svg { width: 15px; height: 15px; }
.chip-shuffle { margin-left: auto; }

.sources { margin: 1.25rem 0 0; font: 400 .9rem/1.9 var(--display); color: var(--faint); }
.sources a { text-decoration: none; margin-right: 1.1rem; white-space: nowrap; }
.sources a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: .2em; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--src, var(--faint)); flex: none; }
.sources .dot { margin-right: .4rem; vertical-align: 1px; }

/* ---------- Stories ---------- */
main { padding-top: 2.5rem; min-height: 60vh; }

.thumb {
  position: relative; overflow: hidden; border-radius: 10px;
  aspect-ratio: 3 / 2;
  background: color-mix(in srgb, var(--src, var(--faint)) 16%, var(--paper));
}
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: color-mix(in srgb, var(--src, var(--faint)) 50%, var(--paper)); }
.thumb .ph svg { width: 34%; max-width: 88px; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.meta { display: flex; align-items: center; gap: .5rem; font: 500 .84rem/1.2 var(--display); color: var(--faint); }
.meta .when { margin-left: auto; }

.headline { font-family: var(--display); font-weight: 700; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
.summary { color: var(--dim); margin: 0; }
.story { display: block; color: inherit; text-decoration: none; }
.story:hover .headline { text-decoration: underline; text-decoration-color: var(--sun); text-decoration-thickness: 3px; text-underline-offset: .16em; }

.lead {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(1.25rem, 4vw, 3rem); align-items: center;
  padding-bottom: 3rem; margin-bottom: 3rem; border-bottom: 1px solid var(--rule);
}
.lead .thumb { aspect-ratio: 16 / 10; border-radius: 14px; }
.lead .meta { margin-bottom: .8rem; font-size: .92rem; }
.lead .headline { font-size: clamp(1.7rem, 3.4vw, 2.75rem); line-height: 1.06; letter-spacing: -.025em; }
.lead .summary { font-size: 1.2rem; margin-top: 1rem; }
.lead .read { display: inline-block; margin-top: 1.25rem; font: 600 .95rem var(--display); color: var(--moss); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 2.75rem 1.75rem; }
.card .meta { margin: .9rem 0 .4rem; }
.card .headline { font-size: 1.22rem; line-height: 1.2; }
.card .headline, .card .summary { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.card .headline { -webkit-line-clamp: 3; margin-bottom: .5rem; }
.card .summary { -webkit-line-clamp: 3; font-size: 1rem; }

.notice { max-width: 46ch; margin: 4rem auto; text-align: center; color: var(--dim); }
.notice h2 { font: 700 1.5rem var(--display); color: var(--ink); margin: 0 0 .5rem; }
.notice code { font-size: .9em; background: var(--surface); border: 1px solid var(--rule); padding: .1em .4em; border-radius: 4px; }
.notice button { margin-top: 1rem; }

/* ---------- Pager ---------- */
.pager { display: flex; justify-content: center; align-items: center; gap: .3rem; margin: 4rem 0 1rem; flex-wrap: wrap; }
.pg {
  min-width: 42px; height: 42px; padding: 0 .5rem; border-radius: 999px;
  font: 600 .95rem var(--display); color: var(--dim);
  background: transparent; border: 1.5px solid transparent; cursor: pointer;
  display: grid; place-items: center;
}
.pg:hover:not(:disabled) { border-color: var(--rule); color: var(--ink); }
.pg[aria-current="page"] { background: var(--ink); color: var(--paper); }
.pg:disabled { opacity: .3; cursor: not-allowed; }
.pg svg { width: 17px; height: 17px; }
.pg-gap { color: var(--faint); padding: 0 .2rem; }

footer { margin-top: 4rem; border-top: 1px solid var(--rule); padding: 2rem 0 3rem; font: 400 .9rem/1.6 var(--display); color: var(--faint); }
footer p { margin: 0 0 .3rem; max-width: 70ch; }

@media (max-width: 820px) {
  .lead { grid-template-columns: 1fr; }
  .chip-shuffle { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .sun { animation: none; }
  * { transition: none !important; }
}
</style>
</head>

<body>
<button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch between light and dark theme">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div class="wrap">
  <header class="masthead">
    <div class="masthead-top">
      <h1 class="title">Good News,<br>Everyone</h1>
      <div class="horizon" aria-hidden="true"><div class="sun"></div></div>
    </div>
    <p class="tagline" id="tagline">Good news about the planet and the people on it.</p>
    <nav class="topics" id="topics" aria-label="Topics"></nav>
    <p class="sources" id="sources"></p>
  </header>

  <main id="main" aria-live="polite">
    <p class="notice" id="loading">Loading stories…</p>
    <div id="stories"></div>
    <nav class="pager" id="pager" aria-label="Pages" hidden></nav>
  </main>
</div>

<footer>
  <div class="wrap">
    <p>Every story links to the publication that reported it. Headlines and short summaries are shown here; the reporting belongs to them.</p>
    <p>&copy; <span id="year"></span> Dan Knight</p>
  </div>
</footer>

<script>
'use strict';

/* ------------------------------------------------------------------
   Topics. Matching is by whole word (plural "s"/"es" allowed);
   a trailing * means "any word starting with this".
------------------------------------------------------------------- */
const TOPICS = [
  { id: 'all', label: 'Everything' },
  { id: 'climate', label: 'Climate', words: [
    'climate', 'emission*', 'carbon', 'net zero', 'greenhouse', 'global warming', 'decarboni*',
    'methane', 'paris agreement', 'fossil fuel*', 'coal', 'sequester*', 'resilience', 'cop30', 'cop31'] },
  { id: 'energy', label: 'Clean energy', words: [
    'solar', 'wind power', 'wind farm', 'offshore wind', 'wind turbine', 'renewable*', 'battery',
    'batteries', 'geothermal', 'hydropower', 'hydrogen', 'grid', 'electric vehicle', 'ev', 'heat pump',
    'clean energy', 'energy storage', 'electrif*', 'e-bike', 'transit', 'tidal'] },
  { id: 'nature', label: 'Nature', words: [
    'wildlife', 'species', 'forest*', 'rewild*', 'reforest*', 'biodiversity', 'conservation', 'habitat',
    'endangered', 'wetland', 'reef', 'coral', 'whale', 'dolphin', 'turtle', 'bird*', 'bee', 'pollinator',
    'rainforest', 'ocean*', 'marine', 'river', 'national park', 'nature', 'tree*', 'tiger', 'elephant',
    'wolf', 'wolves', 'beaver', 'salmon', 'seal', 'sanctuary'] },
  { id: 'food', label: 'Food & farming', words: [
    'food', 'farm*', 'agricultur*', 'regenerative', 'organic', 'plant-based', 'crop', 'harvest', 'soil',
    'compost*', 'garden*', 'vegan', 'meat', 'seed', 'fisher*', 'orchard'] },
  { id: 'community', label: 'People & community', words: [
    'community', 'volunteer*', 'kindness', 'neighbour*', 'neighbor*', 'donat*', 'teacher', 'student',
    'school', 'child', 'children', 'kid', 'rescue*', 'hero*', 'adopt*', 'reunite*', 'homeless*',
    'housing', 'charity', 'generous', 'grandmother', 'grandfather', 'veteran'] },
  { id: 'science', label: 'Science & health', words: [
    'scientist*', 'researcher*', 'study', 'studies', 'cure', 'treatment', 'vaccine', 'discover*',
    'breakthrough*', 'health', 'medic*', 'cancer', 'clinical trial', 'therapy', 'space', 'telescope',
    'hospital', 'disease'] },
];

function buildMatcher(words) {
  const parts = words.map(function (w) {
    const prefix = w.endsWith('*');
    if (prefix) w = w.slice(0, -1);
    const body = w.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[\s-]+/g, '[\\s-]+');
    return prefix ? body + '\\w*' : body + '(?:s|es)?';
  });
  return new RegExp('\\b(?:' + parts.join('|') + ')\\b', 'i');
}
TOPICS.forEach(function (t) { if (t.words) t.matcher = buildMatcher(t.words); });

/* ------------------------------------------------------------------
   State
------------------------------------------------------------------- */
const PAGE_SIZE = 18;                 // grid stories per page
const state = { articles: [], sources: [], lastUpdated: null, topic: 'all', page: 1, shuffled: false, rank: null };
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = function (id) { return document.getElementById(id); };

/* ------------------------------------------------------------------
   Small helpers
------------------------------------------------------------------- */
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }

function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; }
  catch (e) { return ''; }
}

function timeAgo(iso) {
  const d = new Date(iso), s = (Date.now() - d.getTime()) / 1000;
  if (!isFinite(s)) return '';
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' hr ago';
  if (s < 172800) return 'Yesterday';
  if (s < 7 * 86400) return Math.floor(s / 86400) + ' days ago';
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

const SPROUT = '<svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><path d="M22.500 44V24h3v20z"/><path d="M24 26C24 15 17 9 6 9c0 11 7 17 18 17z"/><path d="M24 21c0-8 5.500-13 16-13 0 8-5.500 13-16 13z"/></svg>';
const ICON = {
  shuffle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
};

function sourceColor(name) {
  const s = state.sources.find(function (x) { return x.name === name; });
  return (s && s.color) || '#6b7f72';
}

/* ------------------------------------------------------------------
   Theme
------------------------------------------------------------------- */
$('theme-toggle').addEventListener('click', function () {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('gs-theme', dark ? 'dark' : 'light'); } catch (e) {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? '#0D1812' : '#F2F6F0';
});
(function () {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && document.documentElement.classList.contains('dark')) meta.content = '#0D1812';
})();

/* ------------------------------------------------------------------
   Data
------------------------------------------------------------------- */
async function load() {
  try {
    const res = await fetch('news.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.articles = (data.articles || []).filter(function (a) { return safeUrl(a.link); });
    state.sources = data.sources || [];
    state.lastUpdated = data.lastUpdated || null;
  } catch (err) {
    console.error(err);
    $('loading').hidden = true;
    $('stories').innerHTML = '<div class="notice"><h2>Couldn\u2019t load the stories</h2><p>The data file didn\u2019t load. Check your connection and reload the page.</p></div>';
    return;
  }

  // Tag every article with the topics it matches, once.
  state.articles.forEach(function (a) {
    const text = a.title + ' ' + (a.summary || '');
    a.topics = TOPICS.filter(function (t) { return t.matcher && t.matcher.test(text); }).map(function (t) { return t.id; });
  });

  const fromHash = location.hash.slice(1);
  if (TOPICS.some(function (t) { return t.id === fromHash; })) state.topic = fromHash;

  $('loading').hidden = true;
  renderChrome();
  render();
}

/* ------------------------------------------------------------------
   Masthead: tagline, topic chips, sources
------------------------------------------------------------------- */
function renderChrome() {
  const n = state.articles.length;
  if (n) {
    const when = state.lastUpdated ? ', updated ' + timeAgo(state.lastUpdated) : '';
    $('tagline').textContent = n + ' good news stories from ' + state.sources.length + ' publications' + when + '.';
  }

  const nav = $('topics');
  nav.innerHTML = '';
  TOPICS.forEach(function (t) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t.label;
    b.dataset.topic = t.id;
    b.setAttribute('aria-pressed', String(t.id === state.topic));
    b.addEventListener('click', function () { setTopic(t.id); });
    nav.appendChild(b);
  });
  const sh = document.createElement('button');
  sh.type = 'button'; sh.id = 'shuffle'; sh.className = 'chip chip-shuffle';
  sh.innerHTML = ICON.shuffle + '<span>Shuffle</span>';
  sh.setAttribute('aria-pressed', 'false');
  sh.addEventListener('click', toggleShuffle);
  nav.appendChild(sh);

  $('sources').innerHTML = state.sources.map(function (s) {
    return '<a href="' + esc(safeUrl(s.site)) + '" target="_blank" rel="noopener" style="--src:' + esc(s.color) + '"><span class="dot"></span>' + esc(s.name) + '</a>';
  }).join('');
  $('year').textContent = new Date().getFullYear();
}

function setTopic(id) {
  state.topic = id; state.page = 1;
  if (state.shuffled) reshuffle();
  history.replaceState(null, '', id === 'all' ? location.pathname + location.search : '#' + id);
  document.querySelectorAll('.chip[data-topic]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.topic === id));
  });
  render();
}

function reshuffle() {
  state.rank = new Map(shuffled(state.articles).map(function (a, i) { return [a.link, i]; }));
}
function toggleShuffle() {
  state.shuffled = !state.shuffled; state.page = 1;
  if (state.shuffled) reshuffle();
  $('shuffle').setAttribute('aria-pressed', String(state.shuffled));
  render();
}

/* ------------------------------------------------------------------
   Story list + paging
   Page 1 = one lead story + PAGE_SIZE grid stories; later pages = PAGE_SIZE.
------------------------------------------------------------------- */
function visibleList() {
  const list = state.articles.filter(function (a) { return state.topic === 'all' || a.topics.indexOf(state.topic) !== -1; });
  if (state.shuffled && state.rank) list.sort(function (a, b) { return state.rank.get(a.link) - state.rank.get(b.link); });
  else list.sort(function (a, b) { return b.published < a.published ? -1 : b.published > a.published ? 1 : 0; });
  return list;
}
function totalPages(n) { const first = PAGE_SIZE + 1; return n <= first ? 1 : 1 + Math.ceil((n - first) / PAGE_SIZE); }
function pageSlice(list, page) {
  const first = PAGE_SIZE + 1;
  if (page === 1) return list.slice(0, first);
  const start = first + (page - 2) * PAGE_SIZE;
  return list.slice(start, start + PAGE_SIZE);
}

/* ------------------------------------------------------------------
   Rendering
------------------------------------------------------------------- */
function thumbHtml(a, eager) {
  const img = a.image_url && safeUrl(a.image_url)
    ? '<img src="' + esc(safeUrl(a.image_url)) + '" alt="" ' + (eager ? '' : 'loading="lazy" ') + 'referrerpolicy="no-referrer">'
    : '';
  return '<div class="thumb"><div class="ph">' + SPROUT + '</div>' + img + '</div>';
}
function metaHtml(a) {
  return '<div class="meta"><span class="dot"></span><span>' + esc(a.source) + '</span><span class="when">' + esc(timeAgo(a.published)) + '</span></div>';
}
function leadHtml(a) {
  return '<a class="story lead" href="' + esc(safeUrl(a.link)) + '" target="_blank" rel="noopener" style="--src:' + esc(sourceColor(a.source)) + '">' +
    thumbHtml(a, true) +
    '<div>' + metaHtml(a) + '<h2 class="headline">' + esc(a.title) + '</h2>' +
    (a.summary ? '<p class="summary">' + esc(a.summary) + '</p>' : '') +
    '<span class="read">Read at ' + esc(a.source) + '</span></div></a>';
}
function cardHtml(a) {
  return '<a class="story card" href="' + esc(safeUrl(a.link)) + '" target="_blank" rel="noopener" style="--src:' + esc(sourceColor(a.source)) + '">' +
    thumbHtml(a, false) + metaHtml(a) + '<h2 class="headline">' + esc(a.title) + '</h2>' +
    (a.summary ? '<p class="summary">' + esc(a.summary) + '</p>' : '') + '</a>';
}

function render() {
  const list = visibleList();
  const pages = totalPages(list.length);
  state.page = Math.min(state.page, pages);
  const items = pageSlice(list, state.page);
  const box = $('stories');

  if (!items.length) {
    const none = !state.articles.length;
    box.innerHTML = none
      ? '<div class="notice"><h2>No stories yet</h2><p>Run <code>python src/news_aggregator.py</code> to fetch the first batch, then reload.</p></div>'
      : '<div class="notice"><h2>Nothing under this topic right now</h2><p>New stories arrive through the day. Try another topic in the meantime.</p></div>';
    $('pager').hidden = true;
    return;
  }

  let lead = null, rest = items;
  if (state.page === 1 && items.length > 3) {
    // Prefer a lead story that has a picture.
    let idx = items.findIndex(function (a) { return a.image_url; });
    if (idx < 0) idx = 0;
    lead = items[idx];
    rest = items.filter(function (_, i) { return i !== idx; });
  }
  box.innerHTML = (lead ? leadHtml(lead) : '') + '<div class="grid">' + rest.map(cardHtml).join('') + '</div>';

  // If a picture fails to load, remove it so the placeholder shows.
  box.querySelectorAll('.thumb img').forEach(function (img) {
    img.addEventListener('error', function () { img.remove(); }, { once: true });
  });

  renderPager(pages);
}

function pageList(cur, total) {
  if (total <= 7) return Array.from({ length: total }, function (_, i) { return i + 1; });
  const out = [1];
  if (cur > 3) out.push('gap');
  for (let i = Math.max(2, cur - 1); i <= Math.min(total - 1, cur + 1); i++) out.push(i);
  if (cur < total - 2) out.push('gap');
  out.push(total);
  return out;
}

function renderPager(total) {
  const nav = $('pager');
  if (total <= 1) { nav.hidden = true; nav.innerHTML = ''; return; }
  nav.hidden = false; nav.innerHTML = '';

  function go(p) {
    state.page = p; render();
    window.scrollTo({ top: 0, behavior: reducedMotion ? 'auto' : 'smooth' });
  }
  function btn(html, label, onClick, disabled) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pg'; b.innerHTML = html;
    b.setAttribute('aria-label', label); b.disabled = !!disabled;
    b.addEventListener('click', onClick);
    return b;
  }
  nav.appendChild(btn(ICON.left, 'Previous page', function () { go(state.page - 1); }, state.page === 1));
  pageList(state.page, total).forEach(function (p) {
    if (p === 'gap') { const g = document.createElement('span'); g.className = 'pg-gap'; g.textContent = '…'; nav.appendChild(g); return; }
    const b = btn(String(p), 'Page ' + p, function () { go(p); });
    if (p === state.page) b.setAttribute('aria-current', 'page');
    nav.appendChild(b);
  });
  nav.appendChild(btn(ICON.right, 'Next page', function () { go(state.page + 1); }, state.page === total));
}

$('year').textContent = new Date().getFullYear();
load();
</script>
</body>
